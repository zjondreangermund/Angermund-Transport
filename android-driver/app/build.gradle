plugins {
    id 'com.android.application'
}

android {
    namespace 'na.com.angermund.transport'
    compileSdk 35

    defaultConfig {
        applicationId "na.com.angermund.transport"
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName "1.4.4"
        buildConfigField "String", "SERVER_URL", '"https://angermund-transport-production.up.railway.app"'
    }

    testOptions { unitTests.includeAndroidResources = true }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
