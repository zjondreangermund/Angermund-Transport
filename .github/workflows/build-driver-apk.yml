name: Build Angermund Driver APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
