name: Build Angermund Driver APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare exact original A icon
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import base64, io, hashlib
          src=Image.open("public/angermund-logo.png").convert("RGBA")
          mark=src.crop((0,0,724,724)).resize((512,512),Image.Resampling.LANCZOS)
          buf=io.BytesIO()
          mark.save(buf,format="PNG",optimize=True)
          data=buf.getvalue()
          print("ORIGINAL_A_SIZE",mark.size,"BYTES",len(data),"SHA256",hashlib.sha256(data).hexdigest())
          print("ORIGINAL_A_B64_BEGIN")
          print(base64.b64encode(data).decode("ascii"))
          print("ORIGINAL_A_B64_END")
          PY

      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk Angermund-Transport.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Angermund Transport Android" --notes "Latest installable Android build for Angermund Transport."
          gh release upload android-latest Angermund-Transport.apk --clobber
