name: Build Angermund Driver APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inspect original Angermund icon
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          for path in [
              "android-driver/app/src/main/res/drawable/angermund_icon.png",
              "public/angermund-logo.png"
          ]:
              im=Image.open(path).convert("RGB")
              print("\nICON_SOURCE",path,"SIZE",im.size)
              w=64
              h=max(1,round(im.height*w/im.width))
              sm=im.resize((w,h))
              chars=[]
              for yy in range(h):
                  row=[]
                  for xx in range(w):
                      r,g,b=sm.getpixel((xx,yy))
                      if max(r,g,b)<45: c=" "
                      elif r>190 and g>190 and b>190: c="#"
                      elif b>120 and b>r*1.15: c="B"
                      elif r>140 and g>140 and b<120: c="Y"
                      else: c="."
                      row.append(c)
                  chars.append("".join(row))
              print("\n".join(chars))
          PY


      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk Angermund-Transport.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Angermund Transport Android" --notes "Latest installable Android build for Angermund Transport."
          gh release upload android-latest Angermund-Transport.apk --clobber
