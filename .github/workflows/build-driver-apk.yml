name: Build Angermund Driver APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inspect original Angermund icon
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("public/angermund-logo.png").convert("RGB")
          def isblue(p):
              r,g,b=p
              return b>80 and b>r*1.12 and b>g*1.02
          for ymax in [120,180,220,260,300]:
              pts=[(x,y) for y in range(ymax) for x in range(900) if isblue(im.getpixel((x,y)))]
              xs=[p[0] for p in pts]; ys=[p[1] for p in pts]
              print("TOP_BOUND",ymax,(min(xs),min(ys),max(xs),max(ys)) if xs else None)
          for xmax in [560,600,620,640,660,680,700]:
              n=sum(1 for y in range(im.height) for x in range(xmax,xmax+10) if isblue(im.getpixel((x,y))))
              print("STRIP",xmax,n)
          PY

      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk Angermund-Transport.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Angermund Transport Android" --notes "Latest installable Android build for Angermund Transport."
          gh release upload android-latest Angermund-Transport.apk --clobber
