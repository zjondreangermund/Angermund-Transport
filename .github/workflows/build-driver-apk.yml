name: Build Angermund Transport APK

permissions:
  contents: write

on:
  pull_request:
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

# Newer main commits must never be overwritten by an older APK build.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Keep Android test signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: angermund-android-debug-keystore-v1

      - name: Test offline GPS queue
        run: gradle -p android-driver :app:testDebugUnitTest --stacktrace

      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Transport-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk Angermund-Transport.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Angermund Transport Android" --notes "Latest installable Android build for Angermund Transport."
          gh release upload android-latest Angermund-Transport.apk --clobber
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*//p' android-driver/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android-driver/app/build.gradle | head -1)
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          # Publish metadata LAST: the app must not offer an APK before it exists.
          printf 'Latest installable Android build for Angermund Transport.\nANGERMUND_VERSION_NAME=%s\nANGERMUND_VERSION_CODE=%s\n' "$VERSION_NAME" "$VERSION_CODE" > android-release-notes.txt
          gh release edit android-latest --notes-file android-release-notes.txt
