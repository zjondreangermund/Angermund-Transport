name: Build Angermund Driver APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-driver-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Inspect original Angermund icon
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("public/angermund-logo.png").convert("RGB")
          print("LOGO_SIZE",im.size)
          counts=[]
          for x in range(im.width):
              n=0
              for y in range(im.height):
                  r,g,b=im.getpixel((x,y))
                  if b>80 and b>r*1.12 and b>g*1.02:
                      n+=1
              counts.append(n)
          runs=[]
          s=None
          for x,n in enumerate(counts+[0]):
              if n>3 and s is None:s=x
              if (n<=3 or x==len(counts)) and s is not None:
                  if x-s>2:runs.append((s,x-1,max(counts[s:x]),sum(counts[s:x])))
                  s=None
          print("BLUE_X_RUNS",runs)
          # Print valley candidates after the left logo mark.
          for x in range(350,900,20):
              print("XCOUNT",x,sum(counts[x:x+20]))
          PY

      - name: Build installable debug APK
        run: gradle -p android-driver :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Angermund-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-driver/app/build/outputs/apk/debug/app-debug.apk Angermund-Transport.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Angermund Transport Android" --notes "Latest installable Android build for Angermund Transport."
          gh release upload android-latest Angermund-Transport.apk --clobber
