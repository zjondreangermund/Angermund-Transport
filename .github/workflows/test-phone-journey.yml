name: Validate phone journey

on:
  pull_request:
    paths:
      - 'phone-test-journey.js'
      - 'public/android-update.js'
      - 'test/android-update.test.js'
      - 'test/desktop-install.test.js'
      - 'public/desktop-install.js'
      - 'public/manifest.json'
      - 'public/index.html'
      - 'public/site-assistant-core.js'
      - 'public/ops-assistant.js'
      - 'test/site-assistant.test.js'
      - 'assistant-trip-actions.js'
      - 'assistant-intelligence.js'
      - 'assistant-ops-audit.js'
      - 'assistant-jobs.js'
      - 'test/assistant-ops-audit.test.js'
      - 'test/assistant-intelligence.test.js'
      - 'assistant-operations.js'
      - 'assistant-extra-actions.js'
      - 'assistant-live-insights.js'
      - 'test/assistant-extra-actions.test.js'
      - 'test/assistant-operations.test.js'
      - 'test/assistant-trip-actions.test.js'
      - 'daily-platform-actions.js'
      - 'test/daily-platform-actions.test.js'
      - 'push-delivery-policy.js'
      - 'test/push-delivery-policy.test.js'
      - 'test/phone-test-journey.test.js'
      - 'record-management.js'
      - 'public/record-manager.js'
      - 'test/record-management.test.js'
      - 'manual-trip-route.js'
      - 'test/manual-trip-route.test.js'
      - 'server.js'
      - 'payroll-cycle.js'
      - 'assistant-operations-answers.js'
      - 'test/payroll-cycle.test.js'
      - 'test/shunter-cutoff-assistant.test.js'
      - 'public/app.js'
      - '.github/workflows/test-phone-journey.yml'
  push:
    branches: [main]
    paths:
      - 'phone-test-journey.js'
      - 'public/android-update.js'
      - 'test/android-update.test.js'
      - 'test/desktop-install.test.js'
      - 'public/desktop-install.js'
      - 'public/manifest.json'
      - 'public/index.html'
      - 'public/site-assistant-core.js'
      - 'public/ops-assistant.js'
      - 'test/site-assistant.test.js'
      - 'assistant-trip-actions.js'
      - 'assistant-intelligence.js'
      - 'assistant-ops-audit.js'
      - 'assistant-jobs.js'
      - 'test/assistant-ops-audit.test.js'
      - 'test/assistant-intelligence.test.js'
      - 'assistant-operations.js'
      - 'assistant-extra-actions.js'
      - 'assistant-live-insights.js'
      - 'test/assistant-extra-actions.test.js'
      - 'test/assistant-operations.test.js'
      - 'test/assistant-trip-actions.test.js'
      - 'daily-platform-actions.js'
      - 'test/daily-platform-actions.test.js'
      - 'push-delivery-policy.js'
      - 'test/push-delivery-policy.test.js'
      - 'test/phone-test-journey.test.js'
      - 'record-management.js'
      - 'public/record-manager.js'
      - 'test/record-management.test.js'
      - 'manual-trip-route.js'
      - 'test/manual-trip-route.test.js'
      - 'server.js'
      - 'payroll-cycle.js'
      - 'assistant-operations-answers.js'
      - 'test/payroll-cycle.test.js'
      - 'test/shunter-cutoff-assistant.test.js'
      - 'public/app.js'
      - '.github/workflows/test-phone-journey.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate rolling three-geofence dispatch and trip kilometres
        run: node --test test/dispatch-rolling-geofences.test.js
      - name: Verify phone GPS kilometres, geofence navigation and safety
        run: node --test test/trip-gps-progress.test.js test/phone-trip-tracking.test.js test/depot-arrival.test.js
      - name: Verify diesel slip odometers contribute to driver payroll
        run: node --test test/diesel-odometer-payroll.test.js test/payroll-trip-link.test.js test/trip-diagnostics.test.js
      - name: Verify linked cross-module audit and approval-only review tasks
        run: node --test test/assistant-ops-audit.test.js
      - name: Verify selective AI model routing, cost controls and private live evidence
        run: node --test test/assistant-intelligence.test.js
      - name: Verify configurable cutoff, shunter bonuses and assistant record answers
        run: node --test test/payroll-cycle.test.js test/shunter-cutoff-assistant.test.js
      - name: Verify trip-linked diesel and post-refuel return kilometres
        run: node --test test/trip-refill-remainder.test.js
      - name: Test isolated phone milestones and existing driver tracking
        run: node --test test/phone-test-journey.test.js test/phone-trip-tracking.test.js test/push-delivery-policy.test.js test/android-update.test.js test/site-assistant.test.js test/daily-platform-actions.test.js test/assistant-trip-actions.test.js test/assistant-operations.test.js test/assistant-extra-actions.test.js test/record-management.test.js test/desktop-install.test.js test/manual-trip-route.test.js
